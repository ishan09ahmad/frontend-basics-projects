<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="logo">
          <img
            src="./images/6c3056665f8945b573189c004e90e2728a92eb63.png"
            alt="chef"
          />

          <h2>The Food Corner</h2>
        </div>

        <hr />

        <div class="links">
          <h3>Quick Links</h3>

          <ul>
            <li>Home</li>
            <li>Your Orders</li>
            <li>Wallet</li>
            <li>Profile</li>
            <li>Logout</li>
          </ul>
        </div>

        <hr />

        <div class="about">
          <h3>More About Us</h3>

          <ul>
            <li>Our Blog</li>
            <li>Upcoming Dishes</li>
            <li>Our Story</li>
            <li>Social Media Links</li>
          </ul>
        </div>
      </aside>

      <main class="main">
        <nav>
          <input type="text" placeholder="Search Food Item" />

          <div class="buttons">
            <button>Signup</button>

            <button>Login</button>

            <img
              src="./images/6c3056665f8945b573189c004e90e2728a92eb63.png"
              alt="profile"
            />
          </div>
        </nav>

        <section class="hero">
          <img src="./images/hero.png" alt="hero-image" />
        </section>

        <section class="menu">
          <h2>Menu</h2>

          <div class="cards" id="cards">

            
            <div class="card">
              <div class="card-image">
                <img
                  src="./images/6c3056665f8945b573189c004e90e2728a92eb63.png"
                  alt="Food"
                />
              </div>

              <div class="card-bottom">
                <div class="left-content">
                  <h3 class="food-name">Food Name</h3>
                  <p class="price">$12.99</p>
                </div>

                <button class="add-btn">Order</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
